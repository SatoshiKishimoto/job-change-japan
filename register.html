    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:var(--dark); color:var(--text); font-family:'DM Sans','Hiragino Sans','Noto Sans',sans-serif; -webkit-text-size-adjust:100%; }
    body { min-height:100vh; padding:16px 16px 40px; }
    .wrap { max-width:480px; margin:0 auto; }

    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .logo { font-family:'Playfair Display',serif; font-weight:900; font-size:18px; color:var(--text); text-decoration:none; white-space:nowrap; }
    .logo span { color:var(--red); }
    .lang { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .lang button { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:12px; padding:6px 9px; border-radius:20px; cursor:pointer; font-family:inherit; }
    .lang button.on { border-color:var(--red); color:var(--text); background:var(--red-dk); }

    .progress { height:4px; background:#222; border-radius:4px; overflow:hidden; margin-bottom:8px; }
    .progress i { display:block; height:100%; width:0; background:var(--red); transition:width .3s ease; }
    .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:22px; min-height:16px; }
    .meta button { background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; padding:0; }
    .meta button:disabled { visibility:hidden; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px 18px; }
    .intro h1 { font-family:'Playfair Display',serif; font-size:26px; line-height:1.3; margin-bottom:12px; }
    .intro h1 em { color:var(--red); font-style:normal; }
    .intro p { font-size:14px; color:#c6c6d0; line-height:1.8; margin-bottom:8px; }
    .intro ul { list-style:none; margin:16px 0 22px; }
    .intro li { font-size:13px; color:#c6c6d0; padding:6px 0 6px 26px; position:relative; line-height:1.6; }
    .intro li::before { content:'✓'; position:absolute; left:4px; color:var(--red); font-weight:700; }

    .q { font-size:19px; font-weight:700; line-height:1.5; margin-bottom:6px; }
    .q-sub { font-size:12px; color:var(--muted); margin-bottom:18px; line-height:1.6; }
    .opts { display:grid; gap:10px; }
    .opts.two { grid-template-columns:1fr 1fr; }
    .opt { width:100%; text-align:left; background:var(--field); border:1.5px solid #3a3a46; color:var(--text); border-radius:10px; padding:15px 14px; font-size:15px; line-height:1.4; cursor:pointer; font-family:inherit; transition:border-color .15s, background .15s; min-height:54px; }
    .opt:active, .opt.sel { border-color:var(--red); background:var(--red-dk); }
    .opt small { display:block; font-size:11px; color:var(--muted); margin-top:3px; }

    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:#c6c6d0; margin-bottom:6px; font-weight:500; }
    .field label .req { color:var(--red); }
    .field label .opt-tag { color:var(--muted); font-weight:400; font-size:11px; }
    .field input { width:100%; padding:14px; background:var(--field); color:var(--text); border:1px solid #444; border-radius:8px; font-size:16px; font-family:inherit; }
    .field input:focus { outline:none; border-color:var(--red); }
    .field .hint { font-size:11px; color:var(--muted); margin-top:5px; line-height:1.5; }

    .agree { display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.6; margin:18px 0 20px; cursor:pointer; color:#c6c6d0; }
    .agree input { width:20px; height:20px; flex-shrink:0; margin-top:1px; accent-color:var(--red); }
    .agree a { color:var(--red); }

    .btn { display:block; width:100%; text-align:center; padding:17px; background:var(--red); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; }
    .btn:disabled { background:#7a1525; cursor:not-allowed; }
    .btn.line { background:#06C755; margin-top:12px; }
    .btn.ghost { background:transparent; border:1px solid #444; color:var(--text); font-weight:500; font-size:14px; margin-top:12px; }
    .err { color:var(--red); font-size:13px; margin-top:12px; text-align:center; line-height:1.6; min-height:1em; }

    .done { text-align:center; }
    .done .check { width:64px; height:64px; border-radius:50%; background:#163d24; color:#4CAF50; font-size:32px; line-height:64px; margin:0 auto 16px; }
    .done h2 { font-size:21px; margin-bottom:10px; }
    .done p { font-size:14px; color:#c6c6d0; line-height:1.8; }
    .receipt { background:var(--field); border:1px solid #333; border-radius:8px; padding:12px; margin:18px 0; font-family:monospace; font-size:14px; }
    .next { text-align:left; background:#101018; border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:20px; }
    .next h3 { font-size:14px; margin-bottom:6px; }
    .next p { font-size:13px; }

    footer { text-align:center; font-size:11px; color:#555; margin-top:26px; line-height:1.8; }
    footer a { color:#777; }
    [hidden] { display:none !important; }
  </style>
</head>

    { v:'永住者・配偶者等', l:{ ja:'永住者・日本人の配偶者など', en:'Permanent resident / Spouse, etc.', vi:'Vĩnh trú / Vợ chồng người Nhật...', ne:'स्थायी बसोबास / जीवनसाथी आदि' } },
    { v:'海外在住',    l:{ ja:'いまは海外に住んでいる', en:'I live outside Japan now', vi:'Đang sống ở nước ngoài', ne:'अहिले जापान बाहिर छु' } },
    { v:'その他',      l:'other' }
  ]},
  q3: { key:'jp', two:true, opts:[
    { v:'N1', l:'N1' }, { v:'N2', l:'N2' }, { v:'N3', l:'N3' }, { v:'N4', l:'N4' }, { v:'N5', l:'N5' },
    { v:'JFT-Basic', l:'JFT-Basic' },
    { v:'資格なし', l:'none' }
  ]},
  q4: { key:'location', opts:[
    { v:'大阪府',            l:{ ja:'大阪', en:'Osaka', vi:'Osaka', ne:'ओसाका' } },
    { v:'関西（大阪以外）',  l:{ ja:'関西（大阪以外）', en:'Kansai (outside Osaka)', vi:'Kansai (ngoài Osaka)', ne:'कान्साई (ओसाका बाहेक)' } },
    { v:'関東',              l:{ ja:'関東（東京など）', en:'Kanto (Tokyo area)', vi:'Kanto (khu vực Tokyo)', ne:'कान्तो (टोकियो क्षेत्र)' } },
    { v:'中部・東海',        l:{ ja:'中部・東海（名古屋など）', en:'Chubu / Tokai (Nagoya area)', vi:'Chubu / Tokai (khu vực Nagoya)', ne:'चुबु / तोकाई (नागोया क्षेत्र)' } },
    { v:'全国 / Nationwide', l:{ ja:'日本のどこでもOK', en:'Anywhere in Japan', vi:'Ở đâu cũng được', ne:'जापानमा जहाँ पनि' } },
    { v:'その他',            l:'other' }
  ]},
  q5: { key:'start', opts:[
    { v:'すぐに働ける', l:{ ja:'すぐに働ける', en:'Right away', vi:'Ngay lập tức', ne:'तुरुन्तै' } },
    { v:'1ヶ月以内',    l:{ ja:'1ヶ月以内', en:'Within 1 month', vi:'Trong vòng 1 tháng', ne:'१ महिनाभित्र' } },
    { v:'3ヶ月以内',    l:{ ja:'3ヶ月以内', en:'Within 3 months', vi:'Trong vòng 3 tháng', ne:'३ महिनाभित्र' } },
    { v:'未定',         l:{ ja:'まだ決めていない', en:'Not decided yet', vi:'Chưa quyết định', ne:'अझै निर्णय गरेको छैन' } }
  ]}
};

// ============================================================
// 状態
// ============================================================
var state = { step:0, lang:'ja', ans:{}, name:'', email:'', phone:'', agree:false, receipt:'' };
var params = new URLSearchParams(location.search);
var SOURCE = params.get('src') || params.get('utm_source') || '';

function storeGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

(function initLang() {
  var p = params.get('lang'), s = storeGet('jcj_lang');
  var nav = (navigator.language || 'ja').slice(0,2);
  var pick = [p, s, nav].filter(function(c){ return c && T[c]; })[0];
  state.lang = pick || 'ja';
})();

function t(k) { return T[state.lang][k]; }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function optLabel(o) {
  if (o.l === 'other') return t('other');
  if (o.l === 'none') return t('none');
  return typeof o.l === 'string' ? o.l : (o.l[state.lang] || o.l.ja);
}

// ============================================================
// 画面描画
// ============================================================
function render() {
  document.documentElement.lang = state.lang;
  document.getElementById('langBar').innerHTML = LANGS.map(function(L) {
    return '<button type="button" class="' + (L.code === state.lang ? 'on' : '') + '" onclick="setLang(\'' + L.code + '\')">' + L.label + '</button>';
  }).join('');
  document.getElementById('corpLink').textContent = t('corp');

  var s = state.step, el = document.getElementById('screen');
  var top = document.getElementById('topBar');
  top.hidden = !(s >= 1 && s <= 6);
  if (!top.hidden) {
    document.getElementById('bar').style.width = (s / 6 * 100) + '%';
    document.getElementById('stepLabel').textContent = t('step').replace('{n}', s);
    document.getElementById('backBtn').textContent = t('back');
  }

  if (s === 0) {
    el.innerHTML = '<div class="intro"><h1>' + t('introTitle') + '</h1><p>' + t('introLead') + '</p><ul>' +
      t('introPoints').map(function(x){ return '<li>' + x + '</li>'; }).join('') +
      '</ul><button type="button" class="btn" onclick="go(1)">' + t('start') + '</button></div>';
  } else if (s >= 1 && s <= 5) {
    var q = Q['q' + s];
    el.innerHTML = '<div class="q">' + t('q' + s) + '</div>' + (t('q' + s + 's') ? '<div class="q-sub">' + t('q' + s + 's') + '</div>' : '<div style="height:12px"></div>') +
      '<div class="opts' + (q.two ? ' two' : '') + '">' +
      q.opts.map(function(o, i) {
        var sel = state.ans[q.key] === o.v ? ' sel' : '';
        return '<button type="button" class="opt' + sel + '" onclick="choose(' + s + ',' + i + ')">' + esc(optLabel(o)) + '</button>';
      }).join('') + '</div>';
  } else if (s === 6) {
    el.innerHTML = '<div class="q">' + t('q6') + '</div><div class="q-sub">' + t('q6s') + '</div>' +
      '<div class="field"><label for="f-name">' + t('name') + ' <span class="req">*</span></label>' +
        '<input id="f-name" type="text" autocomplete="name" autocapitalize="characters" placeholder="' + esc(t('namePh')) + '" value="' + esc(state.name) + '"></div>' +
      '<div class="field"><label for="f-email">' + t('email') + ' <span class="req">*</span></label>' +
        '<input id="f-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="' + esc(t('emailPh')) + '" value="' + esc(state.email) + '">' +
        '<div class="hint">' + t('emailHint') + '</div></div>' +
      '<div class="field"><label for="f-phone">' + t('phone') + ' <span class="opt-tag">' + t('optional') + '</span></label>' +
        '<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="' + esc(t('phonePh')) + '" value="' + esc(state.phone) + '"></div>' +
      '<label class="agree"><input type="checkbox" id="f-agree"' + (state.agree ? ' checked' : '') + '><span>' + t('agree').replace('{p}', PRIVACY_URL) + '</span></label>' +
      '<button type="button" class="btn" id="subBtn" onclick="submitForm()">' + t('submit') + '</button>' +
      '<div class="err" id="err"></div>';
  } else if (s === 7) {
    var lineBlock = LINE_URL ? '<a class="btn line" href="' + esc(LINE_URL) + '" target="_blank" rel="noopener">' + t('lineBtn') + '</a><p style="font-size:12px;color:var(--muted);margin-top:8px;">' + t('lineText') + '</p>' : '';
    el.innerHTML = '<div class="done"><div class="check">✓</div><h2>' + t('doneTitle') + '</h2><p>' + t('doneText') + '</p>' +
      (state.receipt ? '<div class="receipt">' + t('receipt') + ': ' + esc(state.receipt) + '</div>' : '') +
      lineBlock +
      '<div class="next"><h3>' + t('nextTitle') + '</h3><p>' + t('nextText') + '</p>' +
      '<a class="btn ghost" href="detail_form.html">' + t('nextBtn') + '</a></div>' +
      '<a class="btn ghost" href="index.html" style="border:none;color:var(--muted)">' + t('home') + '</a></div>';
  }
}

function saveFields() {
  var n = document.getElementById('f-name'); if (!n) return;
  state.name = n.value.trim();
  state.email = document.getElementById('f-email').value.trim();
  state.phone = document.getElementById('f-phone').value.trim();
  state.agree = document.getElementById('f-agree').checked;
}
function setLang(c) { saveFields(); state.lang = c; storeSet('jcj_lang', c); render(); }
function go(n) { saveFields(); state.step = n; render(); window.scrollTo(0, 0); }
function back() { if (state.step > 1) go(state.step - 1); }
function choose(step, i) {
  var q = Q['q' + step];
  state.ans[q.key] = q.opts[i].v;
  render();
  setTimeout(function(){ go(step + 1); }, 180);
}

// ============================================================
// 送信（既存 GAS の submitInquiry に合わせた形式）
// ============================================================
function submitForm() {
  saveFields();
  var err = document.getElementById('err');
  err.textContent = '';
  if (!state.name) { err.textContent = t('errName'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) { err.textContent = t('errEmail'); return; }
  if (!state.agree) { err.textContent = t('errAgree'); return; }

  var a = state.ans;
  var langLabel = LANGS.filter(function(L){ return L.code === state.lang; })[0].label;
  var message = '【30秒かんたん登録】\n' +
    '在留資格: ' + (a.visa || '') + '\n' +
    '日本語: ' + (a.jp || '') + '\n' +
    '就業開始: ' + (a.start || '') + '\n' +
    '電話/WhatsApp: ' + (state.phone || '-') + '\n' +
    '表示言語: ' + langLabel + (SOURCE ? '\n流入元: ' + SOURCE : '');

  var p = {
    action:     'submitInquiry',
    clientType: 'individual',
    name:       state.name,
    email:      state.email,
    role:       a.role || '',
    salary:     '',
    bonus:      'どちらでも / Either',
    location:   a.location || '',
    housing:    'どちらでも / Either',
    message:    message
  };

  var btn = document.getElementById('subBtn');
  btn.disabled = true; btn.textContent = t('sending');

  fetch(GAS_URL + '?action=submitInquiry&data=' + encodeURIComponent(JSON.stringify(p)))
    .then(function(r){ return r.json(); })
    .then(function(res) {
      if (res && res.success) { state.receipt = res.id || ''; go(7); }
      else { throw new Error((res && res.message) || ''); }
    })
    .catch(function(e) {
      err.textContent = t('errSend') + (e && e.message ? ' (' + e.message + ')' : '');
      btn.disabled = false; btn.textContent = t('submit');
    });
}

render();
</script>
</body>
</html>
