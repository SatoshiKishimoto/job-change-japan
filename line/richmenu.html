<!doctype html>
<!-- リッチメニュー画像の元（2500×1686）。line/make_richmenu.js で richmenu.png を作る -->
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:2500px;height:1686px;background:#0f0f14;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}
  .grid{position:absolute;inset:20px 20px 30px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:36px}
  .card{background:#1b1c24;border:3px solid #2c2d38;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  .card.hl{border-color:#e8294a;background:#22161c}
  svg{width:220px;height:220px;fill:none;stroke:#e8294a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .ja{color:#fff;font-weight:900;font-size:118px;line-height:1;letter-spacing:4px}
  .en{color:#9a9ba6;font-size:62px;line-height:1;font-weight:500}
  .badge{position:absolute;margin-top:-470px;margin-left:520px;background:#e8294a;color:#fff;font-weight:900;font-size:50px;padding:8px 26px;border-radius:40px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#e8294a}
</style></head><body>
<div class="grid">
  <div class="card">
    <svg viewBox="0 0 100 100"><rect x="25" y="16" width="50" height="72" rx="6"/><rect x="38" y="10" width="24" height="12" rx="4" fill="#e8294a"/><path d="M36 54 l10 10 l20 -22" stroke="#fff"/></svg>
    <div class="ja">登録</div><div class="en">Register</div>
  </div>
  <div class="card">
    <svg viewBox="0 0 100 100"><rect x="14" y="30" width="72" height="54" rx="6"/><rect x="38" y="18" width="24" height="12" rx="3"/><path d="M14 52 h72"/><rect x="45" y="47" width="10" height="10" fill="#fff" stroke="#fff" stroke-width="2"/></svg>
    <div class="ja">求人を見る</div><div class="en">Jobs</div>
  </div>
  <div class="card hl">
    <svg viewBox="0 0 100 100"><rect x="20" y="12" width="52" height="74" rx="6"/><path d="M31 32 h30 M31 46 h30 M31 60 h16"/><path d="M58 82 l28 -28 l8 8 l-28 28 l-11 3 z" fill="#22161c"/><path d="M80 60 l8 8" /></svg>
    <div class="ja">練習問題</div><div class="en">Practice test</div>
  </div>
  <div class="card">
    <svg viewBox="0 0 100 100"><rect x="12" y="20" width="76" height="48" rx="12"/><path d="M30 68 l-8 18 l22 -18" fill="#e8294a"/><circle cx="34" cy="44" r="4" fill="#fff" stroke="none"/><circle cx="50" cy="44" r="4" fill="#fff" stroke="none"/><circle cx="66" cy="44" r="4" fill="#fff" stroke="none"/></svg>
    <div class="ja">相談する</div><div class="en">Ask us</div>
  </div>
  <div class="card">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38"/><ellipse cx="50" cy="50" rx="16" ry="38"/><path d="M12 50 h76 M18 30 h64 M18 70 h64"/></svg>
    <div class="ja">言語</div><div class="en">Language</div>
  </div>
  <div class="card">
    <svg viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="64" rx="8"/><path d="M10 34 h80"/><circle cx="20" cy="26" r="2.5" fill="#e8294a"/><circle cx="29" cy="26" r="2.5" fill="#e8294a"/><path d="M30 64 l12 -14 l10 10 l16 -18" stroke="#fff"/></svg>
    <div class="ja">サイト</div><div class="en">Website</div>
  </div>
</div>
<div class="bar"></div>
</body></html>
