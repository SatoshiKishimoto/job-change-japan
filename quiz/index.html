<style>
/* Layout: one narrow study column; each question sits on a "伝票" (order-ticket) card with a perforated top edge. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1d2330; --muted:#5d6472; --line:#d9d8d1;
  --ai:#24407a; --ai-soft:#e4e9f4; --ok:#1f7a4d; --ok-soft:#e1f2e8; --ng:#b3342b; --ng-soft:#f8e3e1;
  --line-green:#06c755; --rt:#6b7488;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171e; --surface:#1d212b; --ink:#e8e9ec; --muted:#a3a9b6; --line:#323846;
  --ai:#8fa9e6; --ai-soft:#25304a; --ok:#5fc48f; --ok-soft:#1d3528; --ng:#ef8a80; --ng-soft:#3d2422; --rt:#9aa3b6; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.9;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
rt{font-size:.52em;color:var(--rt);font-weight:400;letter-spacing:0}
body.nofuri rt{display:none}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.5}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.2rem}
p{margin:0}
.en{display:block;font-size:.85rem;color:var(--muted);line-height:1.6}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--ai);font-weight:700}
.muted{color:var(--muted);font-size:.92rem}
header{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--ai)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.mode:hover{border-color:var(--ai)}
.mode:focus-visible,.choice:focus-visible,.btn:focus-visible,.pal button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.mode .name{font-weight:700;line-height:1.6}
.mode .sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.mode .count{font-variant-numeric:tabular-nums;color:var(--ai);font-weight:700;white-space:nowrap}
.mock{border:2px solid var(--ai)}
.mock .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.credits{font-variant-numeric:tabular-nums;font-weight:700}
.credits b{font-family:var(--f-display);font-size:1.6rem;color:var(--ai)}
.price{background:var(--ai-soft);border-radius:8px;padding:10px 14px}
.price b{color:var(--ai)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:4px 4px 10px 10px;position:relative;padding:22px 18px 18px}
.ticket::before{content:"";position:absolute;left:12px;right:12px;top:8px;border-top:2px dashed var(--line)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.chip{display:inline-block;background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:0 10px;font-weight:700;font-size:.8rem;line-height:1.9}
.num{font-variant-numeric:tabular-nums}
.qtext{font-size:1.1rem;font-weight:700;line-height:2.1;margin:0 0 14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:2;color:var(--ink);
  background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice .mk{flex:none;width:28px;height:28px;margin-top:4px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:700;line-height:1}
.choice > span:last-child{min-width:0}
.choice:disabled{cursor:default}
.choice.sel{border-color:var(--ai);background:var(--ai-soft)}
.choice.sel .mk{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .mk{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.feedback{margin-top:14px;border-radius:8px;padding:12px 14px;line-height:2}
.feedback.ok{background:var(--ok-soft)} .feedback.ng{background:var(--ng-soft)}
.feedback .verdict{font-weight:700;display:block}
.feedback.ok .verdict{color:var(--ok)} .feedback.ng .verdict{color:var(--ng)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ai);width:0;transition:width .25s}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--ai);background:var(--ai);color:var(--surface);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.6}
.btn.ghost{background:transparent;color:var(--ai)}
.btn.line{background:var(--line-green);border-color:var(--line-green);color:#fff}
.btn.wide{width:100%}
.btn.stacked{flex-direction:column}
.btn small{font-weight:400;font-size:.8rem;opacity:.9}
h1 .ln{display:inline-block}
.btn:disabled{opacity:.5;cursor:default}
.confirm{border:1.5px solid var(--ai);background:var(--ai-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 0;cursor:pointer;line-height:1.6}
.pal button.done{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:700}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.pill{display:inline-block;border-radius:999px;padding:0 12px;font-weight:700;font-size:.85rem;line-height:2}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ng{background:var(--ng-soft);color:var(--ng)}
.meter{position:relative;height:10px;background:var(--line);border-radius:5px;margin:4px 0}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--ai)}
.meter > b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:65%}
.breakdown{width:100%;border-collapse:collapse;font-size:.95rem}
.breakdown td{padding:8px 0;border-bottom:1px solid var(--line)}
.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px}
.review article{border-top:1px solid var(--line);padding-top:12px;line-height:2}
.review .a{color:var(--ok);font-weight:700}
.review .k{color:var(--ng)}
.center{text-align:center;padding:40px 0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ai)}
.clock.low{color:var(--ng)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.points{font-family:var(--f-display);font-size:1.1rem}
.free-group{display:flex;flex-direction:column;gap:10px}
.free-group h3{margin:6px 0 0;font-size:1rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:10px}
.tabs button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.5}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ai)}
.tabs button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.inst{font-size:.85rem;color:var(--muted);line-height:1.7;margin:0 0 8px}
.qtext u{text-decoration-thickness:2px;text-underline-offset:5px}
.qtext .word{font-size:1.3rem}
.mockrow{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.audio{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.audio audio{width:100%}
.scene{background:var(--ai-soft);border-radius:8px;padding:10px 12px;margin:0 0 12px;line-height:1.9}
.review audio{width:100%;margin:4px 0}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px;line-height:2;font-size:1rem}
.passage u{text-decoration-thickness:2px;text-underline-offset:5px}
.passage-sub{font-size:.85rem;color:var(--muted);margin:0 0 6px}
details summary{cursor:pointer;color:var(--ai);font-weight:700}
footer{font-size:.82rem;color:var(--muted);line-height:1.8}
footer p{margin:0 0 6px}
a{color:var(--ai)}
@media (prefers-reduced-motion: reduce){.progress > i{transition:none}}
</style>
</head>

  if (e && e.silent) return;
  const msg = e && e.error === 'network' ? L.errNet : L.errServer;
  const code = e && e.error ? `<span class="en">error: ${esc(e.error)}${e.detail ? ' / ' + esc(e.detail) : ''}</span>` : '';
  app.innerHTML = `<section class="panel"><p>${msg}${code}</p><div class="actions"><button class="btn" id="retry">${L.retry}</button></div></section>`;
  document.getElementById('retry').onclick = retry || boot;
}

// ---------- はじまり ----------
async function boot(){
  if (!C.LIFF_ID || !C.API_URL) { app.innerHTML = `<section class="panel"><p>${L.notReady}</p></section>`; return; }
  app.innerHTML = `<p class="center muted">${L.loading}</p>`;
  try {
    await liff.init({ liffId: C.LIFF_ID });
  } catch (e) { console.error(e); return showError({ error:'network' }); }
  if (!liff.isLoggedIn()) {
    loginGate();
    return;
  }
  TOKEN = liff.getAccessToken();
  try {
    ME = await api({ api:'me' });
    if (!ME.counts) throw { error:'gas_not_updated' };   // GASに練習問題の機能がまだ入っていない
    home();
  } catch (e) { console.error(e); showError(e && e.error ? e : { error:'page', detail: String(e && e.message || e) }); }
}

function loginGate(){
  app.innerHTML = `
  <section class="panel">
    <h2>${L.gateHead}</h2>
    <p>${L.gateBody}<span class="en">Free for friends of the Job Change Japan LINE account. Please log in with LINE.</span></p>
    <button class="btn line wide stacked" id="login"><span>${L.loginBtn}</span><small>Log in with LINE</small></button>
    <p class="muted">${L.agree} <a href="terms.html">${L.terms}</a><span class="en">By using this service, you agree to the <a href="terms.html">Terms of Use</a>.</span></p>
  </section>`;
  document.getElementById('login').onclick = () => liff.login({ redirectUri: location.href });
}

function friendGate(name){
  toTop();
  app.innerHTML = `
  <section class="panel">
    <h2>${fill(L.friendHead, { name: esc(name || '') })}</h2>
    <p>${L.friendBody}<span class="en">These practice questions are free for friends of our official LINE account. Please add us as a friend, then tap "I added".</span></p>
    <a class="btn line wide stacked" href="${FRIEND_URL}" target="_blank" rel="noopener"><span>${L.friendBtn}</span><small>Add friend on LINE</small></a>
    <button class="btn ghost wide stacked" id="recheck"><span>${L.recheck}</span><small>I added — check again</small></button>
  </section>`;
  document.getElementById('recheck').onclick = boot;
}

// ---------- ホーム ----------
let TAB = store.get('tab') === 'n3' ? 'n3' : 'skill';

function home(){
  toTop();
  stopClock();
  stopAudio();
  S = null;
  const credits = ME.credits;
  const open = ME.open;
  const mocks = ME.mocks || { skill: { name:'', size: ME.mockSize, minutes: ME.mockMinutes, maxPoints: ME.maxPoints, passPoints: ME.passPoints } };
  const n3c = ME.n3 || { all: 0 };
  const cats = Object.keys(CATS).filter(c => ME.counts[c]);
  const modeBtn = (key, name, sub, n, exam) => `<button class="mode" data-c="${key}" data-x="${exam || ''}"><span class="name">${name}${sub ? `<span class="sub">${sub}</span>` : ''}</span><span class="count">${n}${L.mon}</span></button>`;
  const mockBlock = (id, sub) => `
      <div class="mockrow">
        <p class="muted">${sub}</p>
        ${open && (open.mock || 'skill') === id ? `<button class="btn wide" data-resume="1">${L.resume}</button>` : ''}
        ${credits > 0 ? `<button class="btn ${open && (open.mock || 'skill') === id ? 'ghost' : ''} wide" data-mock="${id}">${L.mockStart}</button><div class="mconfirm" data-for="${id}"></div>` : ''}
      </div>`;
  const priceBox = (credits > 0 ? '' : `<div class="price">${fill(L.price, { yen: ME.pack.price, n: ME.pack.count })}<br><span class="muted">${L.soon}</span></div>`)
    + `<p class="muted">${L.mockNote}${L.noRefund}<br>${L.noGuarantee}<br>${L.noPlacement} <a href="terms.html">${L.terms}</a></p>`;
  const creditsHead = (title) => `<div class="row"><h2 id="mock-h">${title}</h2><span class="credits">${L.left} <b>${credits}</b> ${L.times}</span></div>`;

  const skillHtml = `
    <p class="muted">${L.skillLead}</p>
    <section class="panel mock" aria-labelledby="mock-h">
      ${creditsHead(L.mock)}
      ${mockBlock('skill', fill(L.mockSub, { n: mocks.skill.size, m: mocks.skill.minutes, max: mocks.skill.maxPoints, pass: mocks.skill.passPoints }))}
      ${priceBox}
    </section>
    <section class="modes" aria-labelledby="free-h">
      <h2 id="free-h">${L.free}</h2>
      <p class="muted">${L.freeSub}</p>
      <div class="free-group"><h3>${L.gakkaHead}</h3>
        ${cats.map(c => modeBtn(c, CATS[c], L.sub[c], ME.counts[c])).join('')}</div>
      <div class="free-group"><h3>${L.jitsugiHead}</h3>
        ${modeBtn('handan', KINDS.handan, L.sub.handan, ME.counts.handan)}
        ${modeBtn('keikaku', KINDS.keikaku, L.sub.keikaku, ME.counts.keikaku)}
        ${ME.counts.jirei ? modeBtn('jirei', KINDS.jirei, L.sub.jirei, ME.counts.jirei) : ''}</div>
      <div class="free-group"><h3>${L.allHead}</h3>
        ${modeBtn('all', L.all, L.allSub, ME.total)}</div>
    </section>`;

  const n3Mocks = Object.keys(mocks).filter(id => mocks[id].exam === 'n3' || (!mocks[id].exam && id.indexOf('n3') === 0));
  const n3Groups = Object.keys(N3.sections).map(sec => {
    const kinds = Object.keys(N3.kinds).filter(k => n3c[k] && N3.kinds[k].sec === sec);
    if (!kinds.length) return '';
    return `<div class="free-group"><h3>${N3.sections[sec]}</h3>${kinds.map(k => modeBtn(k, N3.kinds[k].name, '', n3c[k], 'n3')).join('')}</div>`;
  }).join('');
  const n3Html = `
    <p class="muted">${L.n3Lead}</p>
    ${n3Mocks.length ? `<section class="panel mock" aria-labelledby="mock-h">
      ${creditsHead(L.n3Mock)}
      ${n3Mocks.map(id => mockBlock(id, fill(L.n3MockSub, { name: esc(mocks[id].name), n: mocks[id].size, m: mocks[id].minutes }))).join('')}
      ${priceBox}
      <p class="muted">${L.sharedCredits}${L.n3Soon ? '<br>' + L.n3Soon : ''}</p>
    </section>` : ''}
    <section class="modes" aria-labelledby="free-h">
      <h2 id="free-h">${L.free}</h2>
      <p class="muted">${L.freeSub}</p>
      ${n3Groups}
      <div class="free-group"><h3>${L.allHead}</h3>${modeBtn('all', L.n3All, L.n3AllSub, n3c.all, 'n3')}</div>
    </section>`;

  app.innerHTML = `
  <div class="stack">
    <p>${fill(L.hello, { name: esc(ME.name) })}</p>
    ${n3c.all ? `<div class="tabs" role="tablist">
      <button role="tab" id="tab-skill" aria-selected="${TAB === 'skill'}">${L.tabSkill}</button>
      <button role="tab" id="tab-n3" aria-selected="${TAB === 'n3'}">${L.tabN3}</button>
    </div>` : ''}
    ${TAB === 'n3' && n3c.all ? n3Html : skillHtml}
  </div>`;
  const tabTo = t => { TAB = t; store.set('tab', t); home(); };
  const ts = document.getElementById('tab-skill'), tn = document.getElementById('tab-n3');
  if (ts) { ts.onclick = () => tabTo('skill'); tn.onclick = () => tabTo('n3'); }
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => startPractice(b.dataset.c, b.dataset.x || 'skill'));
  app.querySelectorAll('[data-mock]').forEach(b => b.onclick = () => {
    const id = b.dataset.mock, box = app.querySelector(`.mconfirm[data-for="${id}"]`);
    box.innerHTML = `<div class="confirm"><p>${fill(L.mockConfirm, { n: credits - 1, m: mocks[id].minutes })}</p>
      <div class="actions"><button class="btn" data-go="1">${L.mockGo}</button><button class="btn ghost" data-cancel="1">${L.cancel}</button></div></div>`;
    box.querySelector('[data-go]').onclick = () => startMock(id);
    box.querySelector('[data-cancel]').onclick = () => { box.innerHTML = ''; };
  });
  app.querySelectorAll('[data-resume]').forEach(b => b.onclick = () => resumeMock(open.attemptId));
}

async function backHome(){
  app.innerHTML = `<p class="center muted">${L.loading}</p>`;
  try { ME = await api({ api:'me' }); home(); } catch (e) { showError(e, backHome); }
}

// ---------- 練習（無料・すぐに答え合わせ） ----------
async function startPractice(cat, exam){
  app.innerHTML = `<p class="center muted">${L.loading}</p>`;
  try {
    const j = await api({ api:'practice', cat, exam: exam || 'skill' });
    takePassages(j);
    S = { mode:'practice', list:j.questions, i:0, ans:[] };
    practiceView();
  } catch (e) { showError(e, () => startPractice(cat, exam)); }
}

function practiceView(){
  stopAudio();
  const q = S.list[S.i], n = S.list.length;
  app.innerHTML = `
  <div class="stack" style="gap:14px">
    <div class="progress" aria-hidden="true"><i style="width:${(S.i/n)*100}%"></i></div>
    <article class="ticket">
      <div class="qhead"><span class="chip">${chipOf(q)}</span><span class="num">${L.q} ${S.i+1} / ${n}</span></div>
      ${instOf(q)}${passageOf(q)}${sceneOf(q)}${audioHtml(q, false)}${q.au ? '' : `<p class="qtext">${q.q}</p>`}
      <div class="choices">${q.ch.map((t,k)=>`<button class="choice" data-k="${k}"><span class="mk">${markOf(q)[k]}</span><span>${q.hid ? '' : t}</span></button>`).join('')}</div>
      <div id="fb"></div>
    </article>
    <div class="actions">
      <button class="btn" id="next" hidden>${S.i+1<n ? L.next : L.result}</button>
      <button class="btn ghost" id="quit">${L.quit}</button>
    </div>
  </div>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => practiceAnswer(+b.dataset.k));
  CUR_AU = document.getElementById('au');
  document.getElementById('next').onclick = () => { if (S.i+1<n) { S.i++; practiceView(); toTop(); } else practiceResult(); };
  document.getElementById('quit').onclick = () => { S.ans.length ? practiceResult() : home(); };
  if (S.ans[S.i] !== undefined) practiceAnswer(S.ans[S.i], true);
}

function practiceAnswer(k, replay){
  const q = S.list[S.i];
  if (!replay) S.ans[S.i] = k;
  const right = k === q.a;
  app.querySelectorAll('.choice').forEach(b => {
    const j = +b.dataset.k; b.disabled = true;
    if (j === q.a) b.classList.add('ok'); else if (j === k) b.classList.add('ng');
    if (q.hid) b.lastElementChild.innerHTML = q.ch[j];   // 読み上げた選択肢を、答えたあとで見せる
  });
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (right ? 'ok' : 'ng');
  fb.innerHTML = `<span class="verdict">${right ? L.right : L.wrong + '　' + L.ans + '：' + markOf(q)[q.a]}</span>${q.au ? `<b>${L.listenQ}：</b>${q.q}<br>` : ''}${q.e.replace(/\n/g, '<br>')}`;
  const nx = document.getElementById('next'); nx.hidden = false; nx.focus({ preventScroll:true });
}

function practiceResult(){
  const done = S.ans.map((you,i)=>({ q:S.list[i], you })).filter(x => x.you !== undefined);
  const items = done.map(x => Object.assign({}, x.q, { you:x.you }));
  resultView(items, 'practice');
}

// ---------- 模擬テスト（有料・最後にまとめて採点） ----------
async function startMock(mockId){
  app.innerHTML = `<p class="center muted">${L.loading}</p>`;
  try {
    const j = await api({ api:'mock_start', mock: mockId || 'skill' });
    takePassages(j);
    ME.credits = j.credits;
    S = { mode:'mock', id:j.attemptId, list:j.questions, i:0, ans:new Array(j.questions.length).fill(null), end: j.started + j.minutes * 60000 };
    mockSave(); startClock(); mockView();
  } catch (e) {
    if (e && e.error === 'no_credits') { ME.credits = 0; home(); return; }
    showError(e, backHome);
  }
}

async function resumeMock(id){
  app.innerHTML = `<p class="center muted">${L.loading}</p>`;
  try {
    const j = await api({ api:'mock_resume', attemptId:id });
    takePassages(j);
    const saved = store.get('mock_' + id) || {};
    S = { mode:'mock', id, list:j.questions, i:saved.i || 0, ans:(saved.ans && saved.ans.length === j.questions.length) ? saved.ans : new Array(j.questions.length).fill(null), played: saved.played || [], end: j.started + j.minutes * 60000 };
    if (Date.now() >= S.end) { submitMock(true); return; }   // 時間切れ：保存していた答えで採点
    startClock(); mockView();
  } catch (e) {
    if (e && (e.error === 'done' || e.error === 'not_found')) { backHome(); return; }
    showError(e, () => resumeMock(id));
  }
}

function mockSave(){ store.set('mock_' + S.id, { i:S.i, ans:S.ans, played:S.played || [] }); }

// 残り時間（サーバーの開始時刻から数える）。0になったら自動で採点
function clockText(){
  const ms = Math.max(0, S.end - Date.now()), m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function startClock(){
  stopClock();
  TIMER = setInterval(() => {
    if (!S || S.mode !== 'mock') return stopClock();
    const el = document.getElementById('clock');
    const left = S.end - Date.now();
    if (el) { el.textContent = clockText(); el.classList.toggle('low', left < 5 * 60000); }
    if (left <= 0) { stopClock(); submitMock(true); }
  }, 1000);
}
function stopClock(){ if (TIMER) { clearInterval(TIMER); TIMER = null; } }

function mockView(){
  stopAudio();
  const q = S.list[S.i], n = S.list.length, cur = S.ans[S.i];
  S.played = S.played || [];
  const answered = S.ans.filter(a => a !== null).length;
  app.innerHTML = `
  <div class="stack" style="gap:14px">
    <div class="sticky">
      <div class="bar"><span class="muted num">${fill(L.answered, { a: answered, n })}</span><span class="muted">${L.timeLeft} <span class="clock ${S.end - Date.now() < 300000 ? 'low' : ''}" id="clock">${clockText()}</span></span></div>
      <div class="progress" aria-hidden="true"><i style="width:${(answered/n)*100}%"></i></div>
    </div>
    <article class="ticket">
      <div class="qhead"><span class="chip">${chipOf(q)}</span><span class="num">${L.q} ${S.i+1} / ${n}</span></div>
      ${instOf(q)}${passageOf(q)}${sceneOf(q)}${audioHtml(q, true, S.played && S.played[S.i])}${q.q ? `<p class="qtext">${q.q}</p>` : ''}
      <div class="choices">${q.ch.map((t,k)=>`<button class="choice ${cur===k?'sel':''}" data-k="${k}" aria-pressed="${cur===k}"><span class="mk">${markOf(q)[k]}</span><span>${q.hid ? '' : t}</span></button>`).join('')}</div>
    </article>
    <div class="actions">
      <button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>${L.prev}</button>
      ${S.i+1<n ? `<button class="btn" id="next">${L.next}</button>` : ''}
      <button class="btn ${S.i+1<n ? 'ghost' : ''}" id="submit">${L.submit}</button>
    </div>
    <div id="sconfirm"></div>
    <section class="panel">
      <span class="muted">${L.jump}</span>
      <div class="pal">${S.list.map((_,i)=>`<button data-i="${i}" class="${S.ans[i]!==null?'done':''} ${i===S.i?'cur':''}" aria-label="${i+1}">${i+1}</button>`).join('')}</div>
    </section>
  </div>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    S.ans[S.i] = +b.dataset.k; mockSave();
    // 聴解は、答えを選んでも次へ進まない（音声が止まらないように。「次へ」で進む）
    const listening = !!q.au;
    if (!listening && S.i+1 < n) { S.i++; mockSave(); }
    if (listening) { app.querySelectorAll('.choice').forEach(x => { const on = +x.dataset.k === S.ans[S.i]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); }); return; }
    mockView(); toTop();
  });
  app.querySelectorAll('.pal button').forEach(b => b.onclick = () => { S.i = +b.dataset.i; mockSave(); mockView(); toTop(); });
  const iNow = S.i;
  wireOnce(() => { S.played[iNow] = true; mockSave(); });
  document.getElementById('prev').onclick = () => { if (S.i>0) { S.i--; mockSave(); mockView(); toTop(); } };
  const nx = document.getElementById('next');
  if (nx) nx.onclick = () => { S.i++; mockSave(); mockView(); toTop(); };
  document.getElementById('submit').onclick = () => {
    const left = S.ans.filter(a => a === null).length;
    const box = document.getElementById('sconfirm');
    box.innerHTML = `<div class="confirm"><p>${left ? fill(L.submitLeft, { n:left }) : L.submitAll}</p>
      <div class="actions"><button class="btn" id="sgo">${L.submitGo}</button><button class="btn ghost" id="scancel">${L.cancel}</button></div></div>`;
    document.getElementById('sgo').onclick = submitMock;
    document.getElementById('scancel').onclick = () => { box.innerHTML = ''; };
    box.scrollIntoView({ block:'nearest' });
  };
}

async function submitMock(timeUp){
  stopClock();
  stopAudio();
  app.innerHTML = `<p class="center muted">${timeUp ? L.timeUp + '<br>' : ''}${L.grading}</p>`;
  try {
    const j = await api({ api:'mock_submit', attemptId:S.id, answers:S.ans });
    takePassages(j);
    store.del('mock_' + S.id);
    resultView(j.results, 'mock', j);
  } catch (e) {
    if (e && e.error === 'done') { store.del('mock_' + S.id); backHome(); return; }
    showError(e, submitMock);
  }
}

// ---------- 結果 ----------
function resultView(items, mode, sum){
  toTop();
  stopAudio();
  const isN3 = items.length > 0 && items.every(x => x.x === 'n3');
  const tot = items.length, ok = items.filter(x => x.you === x.a).length;
  const pct = tot ? Math.round(ok / tot * 100) : 0;
  const hasPoints = mode === 'mock' && sum && sum.maxPoints;
  const pass = hasPoints ? sum.pass : pct >= 65;
  const meterPct = hasPoints ? Math.min(100, sum.points / sum.maxPoints * 100) : pct;
  const linePct = hasPoints ? sum.passPoints / sum.maxPoints * 100 : 65;
  const by = {}, byK = {};
  items.forEach(x => {
    const r = x.you === x.a ? 1 : 0;
    by[x.c] = by[x.c] || [0,0]; by[x.c][1]++; by[x.c][0] += r;
    const k = x.k || 'gakka'; byK[k] = byK[k] || [0,0]; byK[k][1]++; byK[k][0] += r;
  });
  const wrong = items.filter(x => x.you !== x.a);
  const row = (name, v) => `<tr><td>${name}</td><td>${v[0]} / ${v[1]}</td></tr>`;
  const kindNames = isN3 ? Object.fromEntries(Object.keys(N3.kinds).map(k => [k, N3.kinds[k].name])) : KINDS;
  const catNames = isN3 ? N3.sections : CATS;
  const pill = isN3 ? '' : `<span class="pill ${pass?'ok':'ng'}">${pass ? L.passOk : L.passNg}</span>`;
  app.innerHTML = `
  <div class="stack">
    <section class="panel">
      <div class="eyebrow">${mode === 'mock' ? L.mockResult : L.resultOf}</div>
      ${hasPoints
        ? `<div class="score"><span class="big">${sum.points}</span><span class="points">/ ${sum.maxPoints}${L.ten}</span>${pill}</div>
           <p class="num">${ok} / ${tot} ${L.correct}（${pct}%）</p>`
        : `<div class="score"><span class="big">${pct}%</span><span class="num">${ok} / ${tot} ${L.correct}</span>${pill}</div>`}
      <div class="meter" role="img" aria-label="${Math.round(meterPct)}%"><i style="width:${meterPct}%"></i>${isN3 ? '' : `<b style="left:${linePct}%"></b>`}</div>
      <p class="muted">${isN3 ? L.n3Line : hasPoints ? fill(L.linePoints, { pass: sum.passPoints, max: sum.maxPoints }) : L.line}</p>
      <p class="muted">${L.noGuarantee}</p>
    </section>
    <section class="panel">
      <h2>${isN3 ? L.byType : L.byKind}</h2>
      <table class="breakdown"><tbody>
        ${Object.keys(kindNames).filter(k => byK[k]).map(k => row(kindNames[k], byK[k])).join('')}
      </tbody></table>
      ${Object.keys(catNames).filter(c => by[c]).length > 1 || !isN3 ? `<h2>${L.byCat}</h2>
      <table class="breakdown"><tbody>
        ${Object.keys(catNames).filter(c => by[c]).map(c => row(catNames[c], by[c])).join('')}
      </tbody></table>` : ''}
    </section>
    <div class="actions">
      ${mode === 'practice' && wrong.length ? `<button class="btn" id="retry">${L.retryWrong}（${wrong.length}${L.mon}）</button>` : ''}
      <button class="btn ghost" id="home">${L.home}</button>
    </div>
    ${wrong.length ? `<section class="panel review"><h2>${L.review}</h2>
      ${wrong.map(x => `<article>
        <div><span class="chip">${chipOf(x)}</span></div>
        ${x.p && PASS[x.p] ? `<details><summary>${L.showPassage}</summary>${passageOf(x)}</details>` : ''}
        ${x.au ? `<audio controls preload="none" src="${x.au}"></audio>` : ''}${x.sc ? `<div class="muted">${x.sc}</div>` : ''}
        <div>${x.q}</div>
        <div class="k">${L.yours}：${x.you === null || x.you === undefined ? L.blank : x.ch[x.you]}</div>
        <div class="a">${L.ans}：${x.ch[x.a]}</div>
        <div class="muted">${x.e.replace(/\n/g, '<br>')}</div></article>`).join('')}
    </section>` : ''}
  </div>`;
  const r = document.getElementById('retry');
  if (r) r.onclick = () => { S = { mode:'practice', list:wrong.map(x => ({ id:x.id, x:x.x, c:x.c, k:x.k, p:x.p, au:x.au, hid:x.hid, sc:x.sc, q:x.q, ch:x.ch, a:x.a, e:x.e })), i:0, ans:[] }; practiceView(); toTop(); };
  document.getElementById('home').onclick = backHome;
}

boot();
</script>
